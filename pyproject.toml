[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-chatgpt-anki"
version = "0.1.0"
description = "Build an Arabic Anki deck with Palestinian Arabic Gemini TTS audio"
requires-python = ">=3.11"
dependencies = [
  "genanki==0.13.1",
  "google-genai==2.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
